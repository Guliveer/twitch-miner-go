services:
  twitch-miner-go:
    # Override image in .env with TWITCH_MINER_IMAGE variable
    image: ${TWITCH_MINER_IMAGE:-ghcr.io/guliveer/twitch-miner-go:latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      PORT: 8080
      NO_TRAY: "true"
      NO_BANNER: "true"
      LOG_FORMAT: json
      LOG_NO_TIME: "true"
      # Optional: Set COOKIE_ENCRYPTION_KEY in .env to encrypt cookies at rest (./tools/gen-cookie-key.sh)
    volumes:
      - ./configs:/configs:ro
      - twitch-miner-data:/data
    healthcheck:
      test: ["CMD", "/twitch-miner-go", "-healthcheck-url", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  twitch-miner-data:
