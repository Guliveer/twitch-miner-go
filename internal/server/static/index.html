<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard — Twitch Miner Go</title>
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141414'/%3E%3Cg fill='none' stroke='%236798ff' stroke-width='2.2'%3E%3Cpath d='M8 12V8h4'/%3E%3Cpath d='M24 12V8h-4'/%3E%3Cpath d='M8 20v4h4'/%3E%3Cpath d='M24 20v4h-4'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%236798ff'/%3E%3C/svg%3E">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/static/style.css">
    </head>

    <body>
        <header>
            <div class="header-left">
                <a href="/" class="brand">Twitch Miner Go</a>
                <nav class="topbar-nav">
                    <a href="/" class="nav-link active">Dashboard</a>
                    <a href="/logs" class="nav-link">Event Logs</a>
                </nav>
            </div>
            <div class="header-right" id="stats-bar">
                <span id="total-streamers">Streamers: —</span>
                <span id="online-streamers">Online: —</span>
                <span id="total-points">Total Points: —</span>
            </div>
        </header>

        <section id="filter-bar">
            <div class="filter-group">
                <label for="filter-account">Account</label>
                <select id="filter-account">
                    <option value="">All Accounts</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-channel">Channel</label>
                <input type="text" id="filter-channel" placeholder="Search channel…">
            </div>
            <div class="filter-group">
                <label for="filter-category">Category</label>
                <select id="filter-category">
                    <option value="">All Categories</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-online">Status</label>
                <select id="filter-online">
                    <option value="">All</option>
                    <option value="true">Online</option>
                    <option value="false">Offline</option>
                </select>
            </div>
            <div class="filter-group filter-actions">
                <button id="clear-filters" type="button">Clear Filters</button>
            </div>
        </section>

        <section id="dashboard-status" class="status-banner hidden" aria-live="polite"></section>

        <main>
            <section id="streamers-section">
                <h2>Streamers</h2>
                <div id="streamers-grid"></div>
            </section>

            <section id="history-section">
                <h2>Earnings History</h2>
                <table id="history-table">
                    <thead>
                        <tr>
                            <th>Reason</th>
                            <th>Count</th>
                            <th>Points</th>
                        </tr>
                    </thead>
                    <tbody id="history-body"></tbody>
                </table>
            </section>
        </main>

        <footer>
            <p>Auto-refreshes every 30 seconds</p>
            <a href="https://github.com/Guliveer/twitch-miner-go" target="_blank" rel="noopener noreferrer">GitHub</a>
        </footer>

        <script src="/static/app.js"></script>
    </body>

</html>
