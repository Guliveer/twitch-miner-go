name: Bug Report
description: Something isn't working as expected
labels: ["bug", "triage"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I am using the [latest release](https://github.com/Guliveer/twitch-miner-go/releases/latest)
          required: true
        - label: I have read the [README](https://github.com/Guliveer/twitch-miner-go#readme)
          required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Run `./twitch-miner-go -version` or check the startup log line.
      placeholder: "1.16.5"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - Docker / Docker Compose
        - Fly.io
        - Other
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Local binary (_run.sh / _run.bat)
        - Docker / Docker Compose
        - Linux service (systemd / OpenRC)
        - Windows service (NSSM)
        - Fly.io
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set config option ...
        2. Start the miner with ...
        3. After X minutes / when streamer goes online ...
        4. See error ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Run with `-log-level debug` for more detail.
        Remove all tokens, passwords, and chat IDs before pasting.
      render: text

  - type: textarea
    id: config
    attributes:
      label: Config snippet (optional)
      description: |
        Paste the relevant section of your YAML config.
        **Remove all auth tokens, passwords, webhook URLs, and chat IDs.**
      render: yaml
