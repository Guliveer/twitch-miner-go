name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE.txt'
      - 'docs/**'
      - '.env.example'
      - 'configs/example.yaml.example'
      - '_install-service.sh'
      - '_run.bat'
      - '_run.sh'
      - '_edit-config.bat'
      - '_edit-config.sh'
      - 'scripts/**'
      - 'tools/**'
      - '.github/**'
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate commit message
        id: validate
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|chore|ci|build)(\([a-zA-Z0-9_-]+\))?(!)?: .+'

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MSG="$PR_TITLE"
            LABEL="PR title"
          else
            MSG="$(git log -1 --format='%s')"
            LABEL="Commit message"
          fi

          echo "$LABEL: $MSG"
          if ! echo "$MSG" | grep -qE "$PATTERN"; then
            echo ""
            echo "🚫 $LABEL does not follow Conventional Commits format."
            echo "This matters because squash-merge uses the PR title as the commit message,"
            echo "and the version bump pipeline reads commit messages on main."
            echo ""
            echo "Format: <type>[optional scope][!]: <description>"
            echo "Types: feat, fix, docs, style, refactor, perf, test, chore, ci, build"
            echo "Examples:"
            echo "  feat: add Docker Compose support"
            echo "  fix(gql): retry on transient failures"
            echo "  feat!: require Twitch runtime identifiers"
            exit 1
          fi

          echo "✅ $LABEL follows Conventional Commits format."

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.validate.outcome }}" = "success" ]; then
            echo "## Commit Lint" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ Commit message follows Conventional Commits format" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Commit Lint" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ Commit message does not follow Conventional Commits format" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Format: \`<type>[optional scope][!]: <description>\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Types: feat, fix, docs, style, refactor, perf, test, chore, ci, build" >> "$GITHUB_STEP_SUMMARY"
          fi

  vet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  test:
    needs: [vet, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test -v ./...

  build:
    needs: [vet, lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: |
          VERSION=$(cat VERSION)
          GIT_COMMIT=$(git rev-parse --short HEAD)
          go build -v -ldflags "-X github.com/Guliveer/twitch-miner-go/internal/version.Number=${VERSION} -X github.com/Guliveer/twitch-miner-go/internal/version.GitCommit=${GIT_COMMIT}" ./...

  summary:
    if: always()
    needs: [commit-lint, vet, lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Pipeline Summary
        run: |
          echo "## Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          check_status() {
            local name="$1"
            local result="$2"
            case "$result" in
              success)    echo "| $name | ✅ Passed |" ;;
              failure)    echo "| $name | ❌ Failed |" ;;
              skipped)    echo "| $name | ⏭️ Skipped |" ;;
              *)          echo "| $name | ❓ Unknown ($result) |" ;;
            esac
          }

          echo "| Step | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          check_status "commit-lint" "${{ needs.commit-lint.result }}" >> "$GITHUB_STEP_SUMMARY"
          check_status "vet" "${{ needs.vet.result }}" >> "$GITHUB_STEP_SUMMARY"
          check_status "lint" "${{ needs.lint.result }}" >> "$GITHUB_STEP_SUMMARY"
          check_status "test" "${{ needs.test.result }}" >> "$GITHUB_STEP_SUMMARY"
          check_status "build" "${{ needs.build.result }}" >> "$GITHUB_STEP_SUMMARY"

          # Overall status
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ needs.commit-lint.result }}" == "failure" ]] || \
             [[ "${{ needs.vet.result }}" == "failure" ]] || \
             [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.test.result }}" == "failure" ]] || \
             [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ **Pipeline failed** — check the individual steps for details" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "✅ **Pipeline passed** — all checks succeeded" >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    needs: [build]
    uses: ./.github/workflows/release.yml
    with:
      dry_run: ${{ github.event_name != 'push' }}
    secrets: inherit
    outputs:
      bumped: ${{ jobs.release.outputs.bump }}
      new_version: ${{ jobs.release.outputs.new_version }}

  docker-publish:
    needs: [release]
    if: >-
      github.event_name == 'push' &&
      needs.release.outputs.bumped != 'skip' &&
      needs.release.outputs.bumped != ''
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.release.outputs.new_version }}
      dry-run: false
    secrets: inherit

  deploy:
    needs: [release]
    if: >-
      github.event_name == 'push' &&
      needs.release.outputs.bumped != 'skip' &&
      needs.release.outputs.bumped != ''
    uses: ./.github/workflows/fly-deploy.yml
    with:
      version: ${{ needs.release.outputs.new_version }}
    secrets: inherit
