name: Benchmarks

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Download dependencies
        run: |
          go mod download
          go install golang.org/x/perf/cmd/benchstat@latest

      - name: Run benchmarks
        id: bench
        run: |
          go test -bench=. -benchmem -count=5 -timeout=300s ./... | tee bench_raw.txt
          echo "## Benchmark Results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat bench_raw.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Compare with baseline (PR only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=1
          git stash --include-untracked
          git checkout origin/main -- .
          git clean -fd
          go test -bench=. -benchmem -count=5 -timeout=300s ./... | tee bench_base.txt || true
          git checkout - .
          git stash pop || true

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Comparison with main" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          benchstat bench_base.txt bench_raw.txt >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Check for regressions (PR only)
        if: github.event_name == 'pull_request'
        run: |
          REGRESSED=$(benchstat -alpha 0.05 bench_base.txt bench_raw.txt 2>&1 | grep -c "slower" || true)
          if [ "$REGRESSED" -gt 0 ]; then
            echo "## ⚠️ Performance Regressions Detected" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            benchstat -alpha 0.05 bench_base.txt bench_raw.txt >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          else
            echo "## ✅ No performance regressions" >> "$GITHUB_STEP_SUMMARY"
          fi
