name: Benchmarks

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Download dependencies
        run: |
          go mod download
          go install golang.org/x/perf/cmd/benchstat@latest

      - name: Run benchmarks
        id: bench
        run: go test -bench=. -benchmem -count=5 -timeout=300s ./... | tee bench_raw.txt

      - name: Generate summary (main)
        if: github.event_name == 'push'
        run: |
          {
            echo "## 🏃 Benchmarks — main"
            echo ""
            echo '```'
            benchstat bench_raw.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compare with baseline (PR only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=1
          git stash --include-untracked
          git checkout origin/main
          go test -bench=. -benchmem -count=5 -timeout=300s ./... | tee bench_base.txt || true
          git checkout -
          git stash pop || true

          {
            echo "## 🏃 Benchmarks — PR vs main"
            echo ""
            echo "Median of 5 runs; Δ < 0 = gain (faster), Δ > 0 = loss (slower)."
            echo ""
            echo "| Benchmark | main | PR | Δ |"
            echo "|---|---|---|---|"
          } > bench_comment.md

          REGRESSED=0
          for NAME in $(grep '^Benchmark' bench_raw.txt | awk '{print $1}' | sed 's/-[0-9]*$//' | sort -u); do
            BASE=$(grep "^${NAME}-" bench_base.txt | awk '{print $3}' | sort -n | awk '{a[NR]=$1} END {if (NR) print (NR%2)? a[(NR+1)/2] : (a[NR/2]+a[NR/2+1])/2}' || true)
            RAW=$(grep "^${NAME}-" bench_raw.txt | awk '{print $3}' | sort -n | awk '{a[NR]=$1} END {if (NR) print (NR%2)? a[(NR+1)/2] : (a[NR/2]+a[NR/2+1])/2}' || true)

            if [ -z "$BASE" ]; then
              # New benchmark: PR run measured, main baseline missing.
              RFMT=$(awk -v r="$RAW" 'BEGIN {
                if (r >= 1000000) rf = sprintf("%.3f ms", r/1000000)
                else if (r >= 1000) rf = sprintf("%.2f µs", r/1000)
                else rf = sprintf("%.1f ns", r)
                print rf
              }')
              echo "| ${NAME} | n/a | ${RFMT} | — |" >> bench_comment.md
              continue
            fi

            ROW=$(awk -v b="$BASE" -v r="$RAW" 'BEGIN {
              if (b == 0) { printf "n/a | n/a | —"; exit }
              d = (r - b) / b * 100
              if (d < -1) v = "⚡ gain"
              else if (d > 1) v = "🐢 loss"
              else v = "≈ no change"
              if (b >= 1000000) bf = sprintf("%.3f ms", b/1000000)
              else if (b >= 1000) bf = sprintf("%.2f µs", b/1000)
              else bf = sprintf("%.1f ns", b)
              if (r >= 1000000) rf = sprintf("%.3f ms", r/1000000)
              else if (r >= 1000) rf = sprintf("%.2f µs", r/1000)
              else rf = sprintf("%.1f ns", r)
              printf "%s | %s | %s %+.2f%%", bf, rf, v, d
            }')
            case "$ROW" in *"🐢 loss"*) REGRESSED=$((REGRESSED + 1)) ;; esac

            printf "| %s | %s |\n" "$NAME" "$ROW" >> bench_comment.md
          done

          {
            echo ""
            if [ "$REGRESSED" -gt 0 ]; then
              echo "> ⚠️ **Performance regressions detected** in $REGRESSED benchmark(s)"
            else
              echo "> ✅ **No performance regressions**"
            fi
            echo ""
            echo "<!-- bench-comment -->"
          } >> bench_comment.md

          cat bench_comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post benchmark comment on PR (PR only)
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          MARKER="<!-- bench-comment -->"

          # Post the new results first so a failure below never leaves the PR
          # without visible benchmark data, then minimize the previous runs as
          # "outdated" so each push yields a fresh comment while history stays
          # one click away (same pattern renovate/dependabot use).
          NEW_ID=$(gh api --method POST \
            "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            -F "body=@bench_comment.md" \
            --jq .id)

          # The REST minimize endpoint was retired from the GitHub API, so the
          # GraphQL minimizeComment mutation is the only supported way to hide
          # old comments. It addresses comments by node_id, not database id.
          gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | \"\\(.id) \\(.node_id)\"" | while read -r COMMENT_ID COMMENT_NODE; do
            if [ "$COMMENT_ID" = "$NEW_ID" ]; then
              continue
            fi
            gh api graphql \
              -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { minimizedComment { isMinimized } } }' \
              -F id="$COMMENT_NODE" > /dev/null
            echo "Minimized previous benchmark comment ${COMMENT_ID}"
          done

          echo "Posted benchmark comment ${NEW_ID} on PR ${PR_NUMBER}"
