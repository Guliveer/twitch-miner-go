name: Docker Publish

on:
  push:
    tags:
      - "v*.*.*"
    paths-ignore:
      - '**/*.md'
      - 'LICENSE.txt'
      - 'docs/**'
      - '.env.example'
      - 'configs/example.yaml.example'
      - '_install-service.sh'
      - '_run.bat'
      - '_run.sh'
      - '_edit-config.bat'
      - '_edit-config.sh'
      - 'scripts/**'
      - 'tools/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and scan only, skip push"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    # Run on version tags or manual trigger
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=tag
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}

      - name: Determine build version
        id: build_version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(cat VERSION)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # push: never push when dry-run; always push on tag events
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.dry-run != 'true' }}
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          annotations: |
            org.opencontainers.image.description=Efficient auto drops and points claim for Twitch
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build_version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Derive short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Run Trivy vulnerability scan
        if: github.event_name != 'workflow_dispatch' || inputs.dry-run != 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:sha-${{ steps.sha.outputs.short }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
