version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    # Bug detection
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Error handling
    - errcheck

    # Security
    - gosec

    # Code quality
    - gocritic
    - misspell
    - bodyclose
    - durationcheck
    - exportloopref
    - makezero
    - nilerr
    - prealloc
    - unconvert
    - unparam
    - whitespace

    # Complexity
    - gocyclo
    - cyclop

    # Duplication
    - dupl

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false
    exclude-functions:
      - (io.Closer).Close
      - (net.Listener).Close

  gosec:
    excludes:
      - G104  # unhandled errors on deferred close - handled by errcheck
      - G304  # file inclusion via variable - expected for config loading

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - hugeParam

  gocyclo:
    min-complexity: 25

  cyclop:
    max-complexity: 25
    skip-tests: true

  dupl:
    threshold: 100

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
  exclude-rules:
    # Test files can be less strict
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - dupl
        - gocyclo
        - cyclop
    # Generated files
    - path: generated
      linters:
        - errcheck
        - gosec
        - dupl
